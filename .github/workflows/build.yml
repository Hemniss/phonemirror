name: Build PhoneMirror

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          # macos-13 a été retiré par GitHub le 4 décembre 2025.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-intel

    runs-on: ${{ matrix.os }}

    # Le token par défaut du dépôt est en lecture seule : sans cela, la
    # création de la release échoue sur « Resource not accessible by
    # integration », alors même que la compilation a réussi.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Download scrcpy binaries
        shell: bash
        run: bash scripts/download-scrcpy.sh

      - name: Install frontend dependencies
        run: npm ci

      # Tests avant le build : scrcpy est déjà téléchargé (étape plus haut),
      # ce dont les tests Rust ont besoin ; dist/ ne l'est pas.
      # dist/ vide créé par précaution : selon la version de Tauri,
      # generate_context! peut exiger que frontendDist existe à la
      # compilation. tauri-action le remplit ensuite (beforeBuildCommand).
      - name: Rust tests
        shell: bash
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Frontend tests
        run: npm run test --if-present

      - name: Script tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/tests/download-scrcpy.test.sh
          bash scripts/tests/install.test.sh
          bash scripts/tests/run-install.test.sh

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Vide hors tag : tauri-action se contente alors de compiler, sans
          # créer de release. Indispensable pour les essais via workflow_dispatch.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('PhoneMirror {0}', github.ref_name) || '' }}
          releaseBody: |
            ## PhoneMirror ${{ github.ref_name }}

            Streamez votre téléphone Android sur votre PC.

            scrcpy et adb sont inclus dans l'installeur : aucune installation
            supplémentaire n'est nécessaire.

            ### Téléchargements
            - **Windows** : le fichier `.exe`
            - **macOS Apple Silicon** (M1 et suivants) : `*_aarch64.dmg`
            - **macOS Intel** : `*_x64.dmg`
            - **Linux** : `.deb` ou `.AppImage`

            ### Prérequis
            Activer le débogage USB sur le téléphone Android :
            Paramètres > À propos > appuyer 7 fois sur « Numéro de build »,
            puis Options pour les développeurs > Débogage USB.

            ### Windows
            L'application n'est pas signée par un certificat payant : Windows
            affiche un avertissement SmartScreen au premier lancement.
            Cliquer sur « Informations complémentaires » puis « Exécuter quand même ».

            ### macOS
            L'application n'est pas notarisée par Apple. Après avoir glissé
            PhoneMirror dans Applications, ouvrir le Terminal et lancer :

            ```
            xattr -cr /Applications/PhoneMirror.app
            ```

            Sans cette commande, macOS refuse de l'ouvrir. Elle retire
            l'attribut de quarantaine posé sur tout fichier téléchargé.
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts (dev builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: phonemirror-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
          retention-days: 7
