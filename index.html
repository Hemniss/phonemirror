<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Thème posé avant le premier rendu (évite un flash clair en sombre),
      // et classe d'arrivée Orga Glass retirée par App après ~1,1 s.
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("phonemirror-storage") || "{}");
          if (s.state && s.state.theme) t = s.state.theme;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.classList.add("og-entering");
      })();
    </script>
    <title>PhoneMirror</title>
  </head>
  <body class="og-root">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
